services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: theluxe
      POSTGRES_USER: theluxe
      POSTGRES_PASSWORD: theluxe
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U theluxe -d theluxe"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: postgres://theluxe:theluxe@postgres:5432/theluxe
      DEBUG: "1"
      SECRET_KEY: django-insecure-u3w8q(z^m5g^6@2gmb_jcy+7)9i(pwg#rk6@+#c6f@v@muan&l
      ALLOWED_HOSTS: "*"
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      INTERNAL_API_BASE_URL: http://backend:8000
      NEXT_PUBLIC_USE_MOCK_BRAND_VOICE: "false"
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
