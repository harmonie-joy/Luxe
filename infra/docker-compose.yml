services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: theluxe
      POSTGRES_USER: theluxe
      POSTGRES_PASSWORD: theluxe
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123456
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: postgres://theluxe:theluxe@postgres:5432/theluxe
      REDIS_URL: redis://redis:6379/0
      DEBUG: "1"
      SECRET_KEY: django-insecure-u3w8q(z^m5g^6@2gmb_jcy+7)9i(pwg#rk6@+#c6f@v@muan&l
      ALLOWED_HOSTS: "*"
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  miniodata: