# Optional, disposable development environment for Copilot cloud agent.
# Installs only repository development dependencies; runs no product services
# and accesses no production databases, credentials, or external AI providers.
name: Copilot Cloud Agent Setup

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # Name required by GitHub Copilot cloud agent.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    # Caps the entire Copilot cloud-agent session (not only setup); GitHub maximum is 59 minutes.
    timeout-minutes: 59
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/base.txt

      - name: Install frontend dependencies
        run: npm ci --prefix frontend --no-audit --no-fund

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements/base.txt
