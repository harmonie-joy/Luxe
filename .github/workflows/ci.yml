name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Route smoke boots `next dev` via playwright.config.ts webServer.
      # The backend is intentionally not running: screens must render without it.
      - run: npm run test:smoke

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: theluxe
          POSTGRES_USER: theluxe
          POSTGRES_PASSWORD: theluxe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U theluxe -d theluxe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite:////tmp/theluxe-ci.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/base.txt
      - run: pip install -r requirements/base.txt
      - run: python manage.py check
      - run: python manage.py test
      - run: python manage.py test content.test_execution_postgres
        env:
          DATABASE_URL: postgres://theluxe:theluxe@localhost:5432/theluxe
